# New-API kkidc 测试环境配置
#
# 使用方法:
#   1. ./ops/scripts/kkidc-test-deploy.sh remote    # 远程部署 kkidc 测试环境
#   2. ./ops/scripts/kkidc-test-deploy.sh local     # 本地部署 kkidc 测试环境
#   3. 访问 http://服务器IP:3001
#
# kkidc 测试环境特点:
#   - 使用端口 3001（生产环境使用 3000）
#   - 使用独立的数据库 new-api-test
#   - 使用独立的 Redis 数据库（db 1）
#   - 使用独立的数据目录 /opt/new-api-test/

version: '3.4'

services:
  new-api-test:
    image: new-api:test
    container_name: new-api-test
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3001:3000"
    volumes:
      - /opt/new-api-test/data:/data
      - /opt/new-api-test/logs:/app/logs
    environment:
      - SQL_DSN=postgresql://newapi:${DB_PASSWORD:-NewApi2024Secure}@new-api-postgres:5432/new-api-test
      - REDIS_CONN_STRING=redis://new-api-redis/1
      - TZ=Asia/Shanghai
      - SESSION_SECRET=${SESSION_SECRET:-test-session-secret-2024}
      - CRYPTO_SECRET=${CRYPTO_SECRET:-test-crypto-secret-2024}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - MEMORY_CACHE_ENABLED=true
    networks:
      - new-api_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  new-api_default:
    external: true
