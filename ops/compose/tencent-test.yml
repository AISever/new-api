# New-API tencent 测试环境配置模板
#
# 使用场景：
#   1. 在 /opt/new-api-test-src 目录中作为 docker-compose.tencent-test.yml 使用
#   2. 配合 ./ops/scripts/tencent-test-deploy.sh 进行独立部署
#   3. 访问 http://服务器IP:3001
#
# 环境特点：
#   - 使用端口 3001
#   - 使用独立的 PostgreSQL 数据库 new-api-test
#   - 使用独立的容器名 new-api-test / postgres-test / redis-test
#   - 使用独立的数据目录 /opt/new-api-test-src/

version: '3.4'

services:
  new-api:
    image: new-api:tencent-test
    container_name: new-api-test
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://newapi:${DB_PASSWORD:-NewApi2024Secure}@postgres:5432/new-api-test
      REDIS_CONN_STRING: redis://redis
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:-ChangeThisToRandomString2024}
      CRYPTO_SECRET: ${CRYPTO_SECRET:-ChangeThisToAnotherRandomString2024}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      MEMORY_CACHE_ENABLED: "true"
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis-test
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres-test
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NewApi2024Secure}
      POSTGRES_DB: new-api-test
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
