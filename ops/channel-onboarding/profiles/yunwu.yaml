version: 1

source:
  slug: yunwu
  name: Yunwu
  base_url: https://yunwu.ai
  docs_url: https://yunwuapi.apifox.cn/
  auth_mode: bearer
  profile_type: aggregator

upstream_facts:
  status: needs-refresh-from-authenticated-ui
  required_before_apply: true
  notes:
    - Extract provider, upstream group, model, and final price tables from the rendered yunwu UI or documented APIs before generating a production write plan.
    - Preserve evidence references for every price row because some yunwu models use per-second or matrix pricing.
    - Preserve upstream cardinality by default; do not merge upstream groups, providers, ratios, or prices without explicit user approval.
  providers:
    - name: Kling
      family: kling
    - name: Vidu
      family: vidu
    - name: DoubaoVideo
      family: doubao-video
  models:
    - id: kling-motion-control
      provider: Kling
      family: kling
      pricing_shape: per_duration_matrix
      billing_unit: second
      billing_unit_label: 按秒
      support_status: blocked
      block_reason: Requires verified per-second version/mode/resolution/upstream-group billing or split routeable model names before target write.
      request_selectors:
        - version
        - mode
        - resolution
        - duration

target:
  environment: test
  channel_scope: personal-production

confirmation:
  required: true
  artifact: ops/local-test/yunwu-onboarding/yunwu-upstream-confirmation.md
  user_confirmed: false

families:
  - family: kling
    channel_type: 50
    adaptor: relay/channel/task/kling
    base_url_strategy: source-base-url
    channel_base_url_suffix: ""
    path_template:
      create: /kling/v1/videos/text2video
      fetch: /kling/v1/videos/text2video/{task_id}
      model_probe: /kling/v1/videos/text2video
    model_source:
      mode: explicit
      models:
        - kling-v1
        - kling-v1-6
        - kling-v2-master
    ignore_models: []
    verification:
      probe_endpoint: /kling/v1/videos/text2video
      probe_request_body:
        model_name: "{test_model}"
      expected_shape: task-endpoint-available
      fail_closed: true

  - family: vidu
    channel_type: 52
    adaptor: relay/channel/task/vidu
    base_url_strategy: source-base-url
    channel_base_url_suffix: ""
    path_template:
      create: /ent/v2/text2video
      fetch: /ent/v2/tasks/{task_id}/creations
      model_probe: /ent/v2/text2video
    model_source:
      mode: explicit
      models:
        - viduq2
        - viduq2-pro
        - viduq2-turbo
        - viduq3
        - viduq3-pro
        - viduq3-turbo
        - viduq3-mix
        - viduq1
        - viduq1-classic
        - vidu2.0
    ignore_models: []
    verification:
      probe_endpoint: /ent/v2/text2video
      probe_request_body:
        model: "{test_model}"
        duration: 5
        resolution: 720p
      expected_shape: task-endpoint-available
      fail_closed: true
      compatibility_assumption: reuse-existing-vidu-adaptor

  - family: doubao-video
    channel_type: 54
    adaptor: relay/channel/task/doubao
    base_url_strategy: source-base-url
    channel_base_url_suffix: ""
    path_template:
      create: /volc/v1/contents/generations/tasks
      fetch: /volc/v1/contents/generations/tasks/{task_id}
      model_probe: /volc/v1/contents/generations/tasks
    model_source:
      mode: explicit
      models:
        - doubao-seedance-1-0-lite-t2v-250428
        - doubao-seedance-1-0-pro-250528
        - doubao-seedance-1-0-pro-fast-251015
        - doubao-seedance-1-5-pro-251215
        - doubao-seedance-1-0-lite-i2v-250428
    ignore_models: []
    verification:
      probe_endpoint: /volc/v1/contents/generations/tasks
      probe_request_body:
        model: "{test_model}"
      expected_shape: task-endpoint-available
      fail_closed: true
      requires_explicit_models: true

groups:
  mode: explicit
  items:
    - source: kling-group-1
      target: video-upstream-kling-group-1
      description: Kling upstream group 1
    - source: kling-group-2
      target: video-upstream-kling-group-2
      description: Kling upstream group 2

pricing:
  mode: manual-review
  pricing_shapes:
    kling-motion-control:
      shape: per_duration_matrix
      support_status: blocked
      billing_strategy: unsupported
      billing_unit: second
      billing_unit_label: 按秒
      block_reason: Per-second matrix pricing must not be collapsed into one ModelPrice.
  group_ratio: {}
  model_ratio: {}
  completion_ratio: {}
  model_price: {}
  model_price_items: {}
  billing_mode: {}
  billing_expr: {}
  required_manual_fields:
    - upstream_facts
    - group_ratio
    - model_ratio
    - completion_ratio
    - model_price_or_billing_expr

channels:
  naming:
    pattern: "newapi::{source_slug}::{family}::{group}"
  tag:
    pattern: "personal-upstream-{source_slug}"
  settings:
    upstream_model_update_check_enabled: false
    upstream_model_update_auto_sync_enabled: false
    upstream_model_update_ignored_models: []

verification:
  local_or_test_dry_run_required: true
  test_environment_required: true
  test_status_url: http://114.66.47.192:3001/api/status
  production_status_url: https://api.aisever.cn/api/status
  production_release_guard:
    requires_backup: true
    requires_test_validation: true
    requires_minimal_change_review: true
    checklist: ops/checklists/kkidc-production-release.md
